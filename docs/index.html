<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Теннис · Пульт</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button id="back" class="icon-button" aria-label="Назад" hidden>
          ‹</button
        ><span id="crumb" class="eyebrow">ПОДГОТОВКА</span
        ><span id="context" class="muted"></span>
      </header>
      <main id="content" tabindex="-1">
        <section id="screen-prep" class="screen"></section>
        <section id="screen-plan" class="screen" hidden></section>
        <section id="screen-match" class="screen" hidden></section>
        <section id="screen-observation" class="screen" hidden></section>
        <section id="screen-advice" class="screen" hidden></section>
        <section id="screen-finish" class="screen" hidden></section>
        <section id="screen-review" class="screen" hidden></section>
        <section id="screen-history" class="screen" hidden></section>
        <section id="screen-details" class="screen" hidden></section>
        <section id="screen-dossier" class="screen" hidden></section>
        <section id="screen-profile" class="screen" hidden></section>
        <section id="screen-settings" class="screen" hidden></section>
        <section id="screen-error" class="screen" hidden></section>
      </main>
      <footer id="actions" class="action-footer" hidden></footer>
      <nav class="bottom-nav" aria-label="Основная навигация">
        <button data-tab="prep">
          <span aria-hidden="true">◎</span>Подготовка
        </button>
        <button data-tab="match"><span aria-hidden="true">◫</span>Матч</button>
        <button data-tab="history">
          <span aria-hidden="true">≡</span>Журнал
        </button>
        <button data-tab="profile">
          <span aria-hidden="true">♙</span>Профиль
        </button>
        <button data-tab="settings">
          <span aria-hidden="true">⚙</span>Настройки
        </button>
      </nav>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
